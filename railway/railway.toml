[railway]

[services.api]
dockerfile = "Dockerfile.api"
ports = [{ port = 3000 }]
environments = [
  { variable = "RPC_PROVIDERS", value = "https://rpc.shitzuapes.xyz,https://rpc.mainnet.near.org,https://rpc.mainnet.fastnear.com,https://rpc.intea.rs" },
  { variable = "FASTNEAR_API_KEY", value = "***REMOVED***" },
  { variable = "RACERBOT_PARENT_ACCOUNT", value = "racerbot.near" },
  { variable = "ROUTER_CONTRACT_ID", value = "racerbotrouter.near" },
  { variable = "RELAYER_ACCOUNT_ID", value = "racerbot.near" },
  { variable = "RELAYER_PRIVATE_KEY", value = "${{secrets.RELAYER_PRIVATE_KEY}}" },
  { variable = "ROUTER_CONTRACT_PRIVATE_KEY", value = "${{secrets.ROUTER_CONTRACT_PRIVATE_KEY}}" },
  { variable = "TREASURY_ACCOUNT_ID", value = "racerbottreasury.near" },
  { variable = "DATABASE_URL", value = "${{PostgreSQL.URL}}" },
  { variable = "REDIS_URL", value = "${{Redis.URL}}" },
  { variable = "TELEGRAM_BOT_TOKEN", value = "${{secrets.TELEGRAM_BOT_TOKEN}}" },
  { variable = "KEY_ENCRYPTION_MASTER_KEY", value = "${{secrets.KEY_ENCRYPTION_MASTER_KEY}}" },
  { variable = "MAIN_WALLET_PRIVATE_KEY", value = "${{secrets.MAIN_WALLET_PRIVATE_KEY}}" },
  { variable = "TREASURY_PRIVATE_KEY", value = "${{secrets.TREASURY_PRIVATE_KEY}}" },
  { variable = "TRIGGER_INTERVAL_MS", value = "5000" },
]

[services.detector]
dockerfile = "Dockerfile.detector"
ports = [{ port = 8080 }]
environments = [
  { variable = "RPC_PROVIDERS", value = "https://rpc.mainnet.fastnear.com,https://rpc.shitzuapes.xyz,https://rpc.intea.rs,https://blissful-capable-road.near-mainnet.quiknode.pro/***REMOVED***/" },
  { variable = "FASTNEAR_API_KEY", value = "***REMOVED***" },
  { variable = "QUICKNODE_ENDPOINT_URL", value = "https://blissful-capable-road.near-mainnet.quiknode.pro/***REMOVED***/" },
  { variable = "DATABASE_URL", value = "${{PostgreSQL.URL}}" },
  { variable = "REDIS_URL", value = "${{Redis.URL}}" },
  { variable = "TRIGGER_INTERVAL_MS", value = "3000" },
]

[services.executor]
dockerfile = "Dockerfile.executor"
ports = [{ port = 8080 }]
environments = [
  { variable = "RPC_PROVIDERS", value = "https://rpc.mainnet.fastnear.com,https://rpc.shitzuapes.xyz,https://rpc.intea.rs,https://blissful-capable-road.near-mainnet.quiknode.pro/***REMOVED***/" },
  { variable = "FASTNEAR_API_KEY", value = "***REMOVED***" },
  { variable = "QUICKNODE_ENDPOINT_URL", value = "https://blissful-capable-road.near-mainnet.quiknode.pro/***REMOVED***/" },
  { variable = "DATABASE_URL", value = "${{PostgreSQL.URL}}" },
  { variable = "REDIS_URL", value = "${{Redis.URL}}" },
  { variable = "KEY_ENCRYPTION_MASTER_KEY", value = "${{secrets.KEY_ENCRYPTION_MASTER_KEY}}" },
]

[services.triggers]
dockerfile = "Dockerfile.triggers"
ports = [{ port = 8080 }]
environments = [
  { variable = "RPC_PROVIDERS", value = "https://rpc.mainnet.fastnear.com,https://rpc.shitzuapes.xyz,https://rpc.intea.rs,https://blissful-capable-road.near-mainnet.quiknode.pro/***REMOVED***/" },
  { variable = "FASTNEAR_API_KEY", value = "***REMOVED***" },
  { variable = "QUICKNODE_ENDPOINT_URL", value = "https://blissful-capable-road.near-mainnet.quiknode.pro/***REMOVED***/" },
  { variable = "DATABASE_URL", value = "${{PostgreSQL.URL}}" },
  { variable = "REDIS_URL", value = "${{Redis.URL}}" },
  { variable = "TRIGGER_INTERVAL_MS", value = "5000" },
]

[plugins.postgresql]
plan = "standard"

[plugins.redis]
plan = "standard"
