version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: racerbot
      POSTGRES_USER: racerbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racerbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://racerbot:${POSTGRES_PASSWORD}@postgres:5432/racerbot
      - REDIS_URL=redis://redis:6379
      - RPC_PROVIDERS=${RPC_PROVIDERS}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - KEY_ENCRYPTION_MASTER_KEY=${KEY_ENCRYPTION_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  detector:
    build:
      context: .
      dockerfile: docker/Dockerfile.detector
    environment:
      - DATABASE_URL=postgres://racerbot:${POSTGRES_PASSWORD}@postgres:5432/racerbot
      - REDIS_URL=redis://redis:6379
      - RPC_PROVIDERS=${RPC_PROVIDERS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  executor:
    build:
      context: .
      dockerfile: docker/Dockerfile.executor
    environment:
      - DATABASE_URL=postgres://racerbot:${POSTGRES_PASSWORD}@postgres:5432/racerbot
      - REDIS_URL=redis://redis:6379
      - RPC_PROVIDERS=${RPC_PROVIDERS}
      - KEY_ENCRYPTION_MASTER_KEY=${KEY_ENCRYPTION_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  triggers:
    build:
      context: .
      dockerfile: docker/Dockerfile.triggers
    environment:
      - DATABASE_URL=postgres://racerbot:${POSTGRES_PASSWORD}@postgres:5432/racerbot
      - REDIS_URL=redis://redis:6379
      - RPC_PROVIDERS=${RPC_PROVIDERS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata: