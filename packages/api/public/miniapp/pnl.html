<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RacerBot — PnL Card</title>
  <!-- Google Fonts: Space Grotesk + Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* RacerBot PNL Card — companion stylesheet */
    .pnl-card {
      --bg-card: #0d1220;
      --bg-card-top: #131a2c;
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.12);
      --text: #f4f6ff;
      --muted: #78829f;
      --faint: #454d66;
      --teal: #23e6c4;
      --teal-dim: #0f8c7c;
      --profit: #35f2b4;
      --loss: #ff5c72;

      width: 380px;
      max-width: 100%;
      border-radius: 24px;
      background: linear-gradient(180deg, var(--bg-card-top) 0%, var(--bg-card) 55%);
      border: 1px solid var(--border);
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
      padding: 26px 26px 20px;
      position: relative;
      overflow: hidden;
      font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
      box-sizing: border-box;
    }

    .pnl-card__watermark {
      position: absolute;
      top: -40px;
      right: -50px;
      width: 220px;
      height: 220px;
      opacity: 0.05;
      transform: rotate(12deg);
      pointer-events: none;
      color: #ffffff;
    }

    .pnl-card__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pnl-card__brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pnl-card__brand-icon {
      width: 20px;
      height: 20px;
      display: block;
    }

    .pnl-card__brand span {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .pnl-card__pill {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--border-strong);
      padding: 5px 10px;
      border-radius: 100px;
      letter-spacing: 0.01em;
    }

    .pnl-card__hero {
      margin-top: 30px;
    }

    .pnl-card__hero-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pnl-card__token {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .pnl-card__tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px 3px 7px;
      border-radius: 100px;
    }

    .pnl-card__tag--profit {
      color: var(--profit);
      background: rgba(53, 242, 180, 0.1);
    }

    .pnl-card__tag--loss {
      color: var(--loss);
      background: rgba(255, 92, 114, 0.1);
    }

    .pnl-card__dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    .pnl-card__pnl {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 58px;
      line-height: 1.02;
      letter-spacing: -0.02em;
      margin-top: 6px;
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      transition: all 0.3s ease;
    }

    .pnl-card__pnl--profit {
      background-image: linear-gradient(135deg, var(--profit), var(--teal-dim));
    }

    .pnl-card__pnl--loss {
      background-image: linear-gradient(135deg, #ff9d8a, var(--loss));
    }

    .pnl-card__sub {
      margin-top: 6px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 500;
    }

    .pnl-card__sub b {
      color: var(--text);
      font-weight: 600;
    }

    .pnl-card__divider {
      margin: 26px 0 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .pnl-card__divider i {
      display: block;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--teal), transparent);
      font-style: normal;
    }

    .pnl-card__divider i:nth-child(1) {
      width: 100%;
      opacity: 0.55;
    }

    .pnl-card__divider i:nth-child(2) {
      width: 62%;
      opacity: 0.3;
    }

    .pnl-card__divider i:nth-child(3) {
      width: 30%;
      opacity: 0.15;
    }

    .pnl-card__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      row-gap: 18px;
    }

    .pnl-card__field label {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .pnl-card__field div {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .pnl-card__footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pnl-card__footer span {
      font-size: 12px;
      color: var(--faint);
      font-weight: 500;
    }

    .pnl-card__handle {
      color: var(--muted);
    }

    /* Live update indicators & animations */
    .pnl-card__live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 600;
      color: var(--teal);
      letter-spacing: 0.05em;
      background: rgba(35, 230, 196, 0.1);
      padding: 2px 7px;
      border-radius: 20px;
      border: 1px solid rgba(35, 230, 196, 0.25);
    }

    .pnl-card__live-pulse {
      width: 6px;
      height: 6px;
      background-color: var(--teal);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--teal);
      animation: pnlPulse 1.8s infinite ease-in-out;
    }

    @keyframes pnlPulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    .pnl-flash-up {
      animation: pnlFlashGreen 0.8s ease;
    }

    .pnl-flash-down {
      animation: pnlFlashRed 0.8s ease;
    }

    @keyframes pnlFlashGreen {
      0% { color: var(--profit) !important; text-shadow: 0 0 10px rgba(53, 242, 180, 0.7); }
      100% { color: var(--text); text-shadow: none; }
    }

    @keyframes pnlFlashRed {
      0% { color: var(--loss) !important; text-shadow: 0 0 10px rgba(255, 92, 114, 0.7); }
      100% { color: var(--text); text-shadow: none; }
    }

    /* Page shell layout */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07090e;
      color: #f4f6ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 40px;
      font-family: "Inter", -apple-system, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Top Switcher (when multiple positions available) */
    .position-switcher {
      display: none;
      width: 100%;
      gap: 8px;
      overflow-x: auto;
      padding: 4px;
      scrollbar-width: none;
    }
    .position-switcher::-webkit-scrollbar { display: none; }
    .position-tab {
      background: #131a2c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #78829f;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .position-tab.active {
      background: rgba(35, 230, 196, 0.15);
      border-color: #23e6c4;
      color: #23e6c4;
    }

    /* Action bar */
    .action-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .action-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #141c2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f4f6ff;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .action-btn:hover {
      background: #1b263e;
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .action-btn-primary {
      background: linear-gradient(135deg, #23e6c4, #0f8c7c);
      border: none;
      color: #0b0e14;
      box-shadow: 0 4px 16px rgba(35, 230, 196, 0.25);
    }

    .action-btn-primary:hover {
      background: linear-gradient(135deg, #35f2b4, #12a694);
      box-shadow: 0 6px 20px rgba(35, 230, 196, 0.4);
    }

    .status-toast {
      font-size: 12px;
      color: #23e6c4;
      text-align: center;
      min-height: 18px;
      transition: opacity 0.3s;
    }

    .live-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
      font-size: 12px;
      color: #78829f;
    }

    .toggle-switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .toggle-checkbox {
      appearance: none;
      width: 32px;
      height: 18px;
      background: #20283d;
      border-radius: 20px;
      position: relative;
      cursor: pointer;
      outline: none;
      transition: background 0.3s;
    }

    .toggle-checkbox:checked {
      background: #23e6c4;
    }

    .toggle-checkbox::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      background: #fff;
      transition: transform 0.3s;
    }

    .toggle-checkbox:checked::before {
      transform: translateX(14px);
      background: #0b0e14;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Position tabs (rendered dynamically if user has multiple positions) -->
    <div class="position-switcher" id="positionSwitcher"></div>

    <!-- PnL Card Target -->
    <div id="pnlCardContainer">
      <div class="pnl-card" id="cardElement">
        <!-- Bolt watermark SVG -->
        <svg viewBox="0 0 40 40" class="pnl-card__watermark" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 3 L10 22 H18 L16 37 L30 16 H21 L23 3 Z" fill="currentColor"/>
        </svg>

        <div class="pnl-card__row">
          <div class="pnl-card__brand">
            <svg viewBox="0 0 40 40" class="pnl-card__brand-icon" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="racerbotBoltGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#4ea8ff" />
                  <stop offset="1%" stop-color="#9b6bff" />
                </linearGradient>
              </defs>
              <path d="M22 3 L10 22 H18 L16 37 L30 16 H21 L23 3 Z" fill="url(#racerbotBoltGrad)"/>
            </svg>
            <span id="botNameText">RacerBot</span>
            <div class="pnl-card__live-indicator" id="liveBadge" style="display: none;">
              <span class="pnl-card__live-pulse"></span> LIVE
            </div>
          </div>
          <div class="pnl-card__pill" id="pairPill">$RCKT / NEAR</div>
        </div>

        <div class="pnl-card__hero">
          <div class="pnl-card__hero-top">
            <span class="pnl-card__token" id="tokenSymbolText">$RCKT</span>
            <span class="pnl-card__tag pnl-card__tag--profit" id="sideTag">
              <span class="pnl-card__dot"></span>
              <span id="sideText">Long</span>
            </span>
          </div>

          <div class="pnl-card__pnl pnl-card__pnl--profit" id="pnlPercentText">+868.3%</div>

          <div class="pnl-card__sub" id="profitSubText">
            +<b>2.8400 NEAR</b> realized profit
          </div>
        </div>

        <div class="pnl-card__divider">
          <i></i>
          <i></i>
          <i></i>
        </div>

        <div class="pnl-card__grid">
          <div class="pnl-card__field">
            <label>Entry price</label>
            <div id="entryPriceVal">$0.000041</div>
          </div>
          <div class="pnl-card__field">
            <label>Current price</label>
            <div id="currentPriceVal">$0.000397</div>
          </div>
          <div class="pnl-card__field">
            <label>Entry cap</label>
            <div id="entryCapVal">$41.2K</div>
          </div>
          <div class="pnl-card__field">
            <label>Current cap</label>
            <div id="currentCapVal">$397.8K</div>
          </div>
          <div class="pnl-card__field">
            <label>Position</label>
            <div id="positionVal">2.40M RCKT</div>
          </div>
          <div class="pnl-card__field">
            <label>Duration</label>
            <div id="durationVal">4h 12m</div>
          </div>
        </div>

        <div class="pnl-card__footer" id="footerElement">
          <span class="pnl-card__handle" id="handleVal">racerbot.near</span>
          <span id="dateVal">Sep 25, 2026</span>
        </div>
      </div>
    </div>

    <!-- Live controls & Actions -->
    <div class="action-bar">
      <div class="live-controls">
        <label class="toggle-switch">
          <input type="checkbox" id="livePollingToggle" class="toggle-checkbox" checked>
          <span>Live Token Updates</span>
        </label>
        <span id="lastUpdatedTime">Auto-syncing...</span>
      </div>

      <div class="btn-row">
        <button class="action-btn action-btn-primary" id="btnDownload">
          📸 Save Card (PNG)
        </button>
        <button class="action-btn" id="btnShareTelegram">
          ✈️ Share
        </button>
      </div>

      <div class="btn-row">
        <button class="action-btn" id="btnCopyLink">
          📋 Copy Link
        </button>
        <button class="action-btn" id="btnRefresh">
          🔄 Refresh
        </button>
      </div>

      <div class="status-toast" id="toastMsg"></div>
    </div>
  </div>

  <canvas id="exportCanvas" style="display: none;"></canvas>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Number formatters matching PnLCard.jsx specification
    function formatPrice(value) {
      if (value === undefined || value === null || isNaN(value)) return "—";
      if (value >= 1) return `$${value.toFixed(2)}`;
      if (value === 0) return "$0.00";
      const abs = Math.abs(value);
      const precision = Math.min(8, Math.max(4, -Math.floor(Math.log10(abs)) + 2));
      return `$${value.toFixed(precision)}`;
    }

    function formatCompact(value) {
      if (value === undefined || value === null || isNaN(value)) return "—";
      if (value >= 1_000_000_000) return `$${(value / 1_000_000_000).toFixed(1)}B`;
      if (value >= 1_000_000) return `$${(value / 1_000_000).toFixed(1)}M`;
      if (value >= 1_000) return `$${(value / 1_000).toFixed(1)}K`;
      return `$${value.toFixed(0)}`;
    }

    function formatPosition(value, unit) {
      if (value === undefined || value === null || isNaN(value)) return "—";
      let out;
      if (value >= 1_000_000) out = `${(value / 1_000_000).toFixed(2)}M`;
      else if (value >= 1_000) out = `${(value / 1_000).toFixed(1)}K`;
      else out = `${Number(value).toFixed(2)}`;
      return `${out} ${unit || ""}`.trim();
    }

    // State
    const state = {
      botName: "RacerBot",
      tokenSymbol: "RCKT",
      pairSymbol: "NEAR",
      side: "long",
      entryPrice: 0.000041,
      currentPrice: 0.000397,
      pnlPercent: undefined,
      entryMcap: 41200,
      currentMcap: 397800,
      positionSize: 2400000,
      positionUnit: "RCKT",
      profitAmount: 2.84,
      profitUnit: "NEAR",
      duration: "4h 12m",
      handle: "racerbot.near",
      date: "Sep 25, 2026",
      tokenAddress: "",
      positionId: "",
      isLive: true,
      lastTickPrice: 0.000397,
    };

    // Parse URL params
    const params = new URLSearchParams(window.location.search);
    if (params.get("botName")) state.botName = params.get("botName");
    if (params.get("tokenSymbol")) state.tokenSymbol = params.get("tokenSymbol");
    if (params.get("pairSymbol")) state.pairSymbol = params.get("pairSymbol");
    if (params.get("side")) state.side = params.get("side");
    if (params.get("entryPrice")) state.entryPrice = parseFloat(params.get("entryPrice"));
    if (params.get("currentPrice")) state.currentPrice = parseFloat(params.get("currentPrice"));
    if (params.get("pnlPercent")) state.pnlPercent = parseFloat(params.get("pnlPercent"));
    if (params.get("entryMcap")) state.entryMcap = parseFloat(params.get("entryMcap"));
    if (params.get("currentMcap")) state.currentMcap = parseFloat(params.get("currentMcap"));
    if (params.get("positionSize")) state.positionSize = parseFloat(params.get("positionSize"));
    if (params.get("positionUnit")) state.positionUnit = params.get("positionUnit");
    if (params.get("profitAmount")) state.profitAmount = parseFloat(params.get("profitAmount"));
    if (params.get("profitUnit")) state.profitUnit = params.get("profitUnit");
    if (params.get("duration")) state.duration = params.get("duration");
    if (params.get("handle")) state.handle = params.get("handle");
    if (params.get("date")) state.date = params.get("date");
    if (params.get("positionId")) state.positionId = params.get("positionId");
    if (params.get("tokenAddress")) state.tokenAddress = params.get("tokenAddress");

    state.lastTickPrice = state.currentPrice;

    // Render state to DOM
    function renderCard(priceFlash = "") {
      const derivedPnl = state.pnlPercent !== undefined
        ? state.pnlPercent
        : (state.entryPrice && state.currentPrice)
          ? ((state.currentPrice - state.entryPrice) / state.entryPrice) * 100
          : 0;

      const isProfit = derivedPnl >= 0;
      const pnlLabel = `${isProfit ? "+" : ""}${Number(derivedPnl).toFixed(1)}%`;

      document.getElementById("botNameText").textContent = state.botName;
      document.getElementById("pairPill").textContent = `$${state.tokenSymbol} / ${state.pairSymbol}`;
      document.getElementById("tokenSymbolText").textContent = `$${state.tokenSymbol}`;

      const sideTag = document.getElementById("sideTag");
      sideTag.className = `pnl-card__tag pnl-card__tag--${isProfit ? "profit" : "loss"}`;
      document.getElementById("sideText").textContent = state.side === "long" ? "Long" : "Short";

      const pnlElement = document.getElementById("pnlPercentText");
      pnlElement.className = `pnl-card__pnl pnl-card__pnl--${isProfit ? "profit" : "loss"}`;
      pnlElement.textContent = pnlLabel;

      if (state.profitAmount !== undefined && !isNaN(state.profitAmount)) {
        const profitSign = state.profitAmount >= 0 ? "+" : "";
        document.getElementById("profitSubText").innerHTML = `
          ${profitSign}<b>${Number(state.profitAmount).toFixed(4)} ${state.profitUnit}</b> ${isProfit ? "realized profit" : "realized loss"}
        `;
        document.getElementById("profitSubText").style.display = "block";
      } else {
        document.getElementById("profitSubText").style.display = "none";
      }

      document.getElementById("entryPriceVal").textContent = formatPrice(state.entryPrice);

      const currentPriceEl = document.getElementById("currentPriceVal");
      currentPriceEl.textContent = formatPrice(state.currentPrice);
      if (priceFlash) {
        currentPriceEl.classList.remove("pnl-flash-up", "pnl-flash-down");
        void currentPriceEl.offsetWidth; // trigger reflow
        currentPriceEl.classList.add(priceFlash === "up" ? "pnl-flash-up" : "pnl-flash-down");
      }

      document.getElementById("entryCapVal").textContent = formatCompact(state.entryMcap);

      const currentCapEl = document.getElementById("currentCapVal");
      currentCapEl.textContent = formatCompact(state.currentMcap);
      if (priceFlash) {
        currentCapEl.classList.remove("pnl-flash-up", "pnl-flash-down");
        void currentCapEl.offsetWidth;
        currentCapEl.classList.add(priceFlash === "up" ? "pnl-flash-up" : "pnl-flash-down");
      }

      document.getElementById("positionVal").textContent = formatPosition(
        state.positionSize,
        state.positionUnit || state.tokenSymbol
      );

      document.getElementById("durationVal").textContent = state.duration || "—";
      document.getElementById("handleVal").textContent = state.handle || "";
      document.getElementById("dateVal").textContent = state.date || "";

      document.getElementById("liveBadge").style.display = state.isLive ? "inline-flex" : "none";
    }

    renderCard();

    // Fetch position details from API if positionId provided
    async function loadPositionData(posId) {
      if (!posId) return;
      try {
        const res = await fetch(`/api/pnl/card-data/${encodeURIComponent(posId)}`);
        if (!res.ok) return;
        const data = await res.json();
        if (data.success && data.card) {
          applyCardData(data.card);
        }
      } catch (err) {
        console.warn("Failed to load position card data:", err);
      }
    }

    // Fetch user cards if userId provided
    const userId = params.get("userId");
    async function loadUserCards(uid) {
      if (!uid) return;
      try {
        const res = await fetch(`/api/pnl/cards/${encodeURIComponent(uid)}`);
        if (!res.ok) return;
        const data = await res.json();
        if (data.success && Array.isArray(data.cards) && data.cards.length > 0) {
          renderPositionSwitcher(data.cards);
          if (!state.positionId) {
            applyCardData(data.cards[0]);
          }
        }
      } catch (err) {
        console.warn("Failed to load user cards:", err);
      }
    }

    function renderPositionSwitcher(cards) {
      const switcher = document.getElementById("positionSwitcher");
      switcher.innerHTML = "";
      switcher.style.display = "flex";

      cards.forEach((card, idx) => {
        const tab = document.createElement("button");
        tab.className = `position-tab ${idx === 0 ? "active" : ""}`;
        const pnlSign = (card.pnlPercent || 0) >= 0 ? "+" : "";
        tab.textContent = `$${card.tokenSymbol} (${pnlSign}${card.pnlPercent}%)`;
        tab.addEventListener("click", () => {
          document.querySelectorAll(".position-tab").forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          applyCardData(card);
        });
        switcher.appendChild(tab);
      });
    }

    function applyCardData(card) {
      state.tokenSymbol = card.tokenSymbol || state.tokenSymbol;
      state.pairSymbol = card.pairSymbol || "NEAR";
      state.side = card.side || "long";
      state.entryPrice = card.entryPrice;
      state.currentPrice = card.currentPrice;
      state.pnlPercent = card.pnlPercent;
      state.entryMcap = card.entryMcap;
      state.currentMcap = card.currentMcap;
      state.positionSize = card.positionSize;
      state.positionUnit = card.positionUnit || card.tokenSymbol;
      state.profitAmount = card.profitAmount;
      state.profitUnit = card.profitUnit || "NEAR";
      state.duration = card.duration;
      state.handle = card.handle || state.handle;
      state.date = card.date || state.date;
      state.tokenAddress = card.tokenAddress || state.tokenAddress;
      state.positionId = card.positionId || state.positionId;
      state.lastTickPrice = card.currentPrice;
      renderCard();
    }

    if (state.positionId) {
      loadPositionData(state.positionId);
    } else if (userId) {
      loadUserCards(userId);
    }

    // Live price polling
    let pollingInterval = null;
    async function pollLivePrice() {
      if (!state.isLive) return;
      const targetToken = state.tokenAddress || (state.tokenSymbol !== "RCKT" ? state.tokenSymbol : "");
      if (!targetToken && !state.positionId) return;

      try {
        let newPrice = state.currentPrice;
        let newMcap = state.currentMcap;

        if (state.positionId) {
          const res = await fetch(`/api/pnl/card-data/${encodeURIComponent(state.positionId)}`);
          if (res.ok) {
            const data = await res.json();
            if (data.card) {
              newPrice = data.card.currentPrice;
              newMcap = data.card.currentMcap;
              state.profitAmount = data.card.profitAmount;
              state.pnlPercent = data.card.pnlPercent;
            }
          }
        } else if (targetToken) {
          const res = await fetch(`/api/pnl/live/${encodeURIComponent(targetToken)}`);
          if (res.ok) {
            const data = await res.json();
            if (data.price) {
              newPrice = data.price;
              newMcap = data.marketCap || (state.entryMcap && state.entryPrice ? (newPrice / state.entryPrice) * state.entryMcap : undefined);
            }
          }
        }

        let flash = "";
        if (newPrice > state.lastTickPrice) flash = "up";
        else if (newPrice < state.lastTickPrice) flash = "down";

        state.lastTickPrice = newPrice;
        state.currentPrice = newPrice;
        state.currentMcap = newMcap;

        renderCard(flash);
        document.getElementById("lastUpdatedTime").textContent = `Updated ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
      } catch (e) {
        console.debug("Live poll heartbeat tick:", e);
      }
    }

    function startLiveUpdates() {
      if (pollingInterval) clearInterval(pollingInterval);
      pollingInterval = setInterval(pollLivePrice, 3500);
      state.isLive = true;
      document.getElementById("liveBadge").style.display = "inline-flex";
      document.getElementById("lastUpdatedTime").textContent = "Live sync active";
    }

    function stopLiveUpdates() {
      if (pollingInterval) clearInterval(pollingInterval);
      pollingInterval = null;
      state.isLive = false;
      document.getElementById("liveBadge").style.display = "none";
      document.getElementById("lastUpdatedTime").textContent = "Live sync paused";
    }

    startLiveUpdates();

    document.getElementById("livePollingToggle").addEventListener("change", (e) => {
      if (e.target.checked) startLiveUpdates();
      else stopLiveUpdates();
    });

    document.getElementById("btnRefresh").addEventListener("click", () => {
      pollLivePrice();
      showToast("Refreshed token data!");
    });

    // Copy Share Link
    document.getElementById("btnCopyLink").addEventListener("click", () => {
      const shareUrl = window.location.href;
      navigator.clipboard.writeText(shareUrl).then(() => {
        showToast("Link copied to clipboard! 📋");
      }).catch(() => {
        showToast("Could not copy link automatically.");
      });
    });

    // Share to Telegram
    document.getElementById("btnShareTelegram").addEventListener("click", () => {
      const derivedPnl = state.pnlPercent !== undefined
        ? state.pnlPercent
        : ((state.currentPrice - state.entryPrice) / state.entryPrice) * 100;
      const pnlSign = derivedPnl >= 0 ? "+" : "";
      const text = `🏎️ Check out my ${pnlSign}${derivedPnl.toFixed(1)}% trade on $${state.tokenSymbol} via @racerbot!`;
      const url = `https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(text)}`;
      if (tg?.openTelegramLink) tg.openTelegramLink(url);
      else window.open(url, "_blank");
    });

    function showToast(msg) {
      const toast = document.getElementById("toastMsg");
      toast.textContent = msg;
      setTimeout(() => {
        if (toast.textContent === msg) toast.textContent = "";
      }, 3000);
    }

    // High-Resolution PNG Card Generator (Canvas 2x rendering)
    document.getElementById("btnDownload").addEventListener("click", async () => {
      const btn = document.getElementById("btnDownload");
      const origText = btn.innerHTML;
      btn.disabled = true;
      btn.textContent = "Rendering...";

      try {
        const canvas = document.getElementById("exportCanvas");
        const ctx = canvas.getContext("2d");
        const scale = 2; // retina 2x

        const w = 380;
        const h = 520;
        canvas.width = w * scale;
        canvas.height = h * scale;
        ctx.scale(scale, scale);

        // Background rounded card
        ctx.save();
        roundRect(ctx, 0, 0, w, h, 24);
        const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
        bgGrad.addColorStop(0, "#131a2c");
        bgGrad.addColorStop(0.55, "#0d1220");
        bgGrad.addColorStop(1, "#0d1220");
        ctx.fillStyle = bgGrad;
        ctx.fill();

        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.stroke();
        ctx.restore();

        // Watermark Bolt
        ctx.save();
        ctx.translate(w - 30, 70);
        ctx.rotate((12 * Math.PI) / 180);
        ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
        drawBoltPath(ctx, -110, -110, 220, 220);
        ctx.fill();
        ctx.restore();

        // Top Row: Brand & Pill
        ctx.save();
        drawBoltPath(ctx, 26, 26, 20, 20);
        const boltGrad = ctx.createLinearGradient(26, 26, 46, 46);
        boltGrad.addColorStop(0, "#4ea8ff");
        boltGrad.addColorStop(1, "#9b6bff");
        ctx.fillStyle = boltGrad;
        ctx.fill();

        ctx.font = "600 15px 'Space Grotesk', sans-serif";
        ctx.fillStyle = "#f4f6ff";
        ctx.fillText(state.botName, 54, 41);

        // Pill
        const pillText = `$${state.tokenSymbol} / ${state.pairSymbol}`;
        ctx.font = "500 11px 'Inter', sans-serif";
        const pillW = ctx.measureText(pillText).width + 20;
        const pillX = w - 26 - pillW;
        roundRect(ctx, pillX, 26, pillW, 24, 12);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.14)";
        ctx.stroke();
        ctx.fillStyle = "#78829f";
        ctx.fillText(pillText, pillX + 10, 42);
        ctx.restore();

        // Hero: Token & Tag
        const derivedPnl = state.pnlPercent !== undefined
          ? state.pnlPercent
          : ((state.currentPrice - state.entryPrice) / state.entryPrice) * 100;
        const isProfit = derivedPnl >= 0;

        ctx.save();
        ctx.font = "500 13px 'Inter', sans-serif";
        ctx.fillStyle = "#78829f";
        ctx.fillText(`$${state.tokenSymbol}`, 26, 92);
        const symW = ctx.measureText(`$${state.tokenSymbol}`).width;

        // Side tag
        const tagX = 26 + symW + 10;
        const tagText = state.side === "long" ? "Long" : "Short";
        ctx.font = "600 11px 'Inter', sans-serif";
        const tagW = ctx.measureText(tagText).width + 20;
        roundRect(ctx, tagX, 78, tagW, 20, 10);
        ctx.fillStyle = isProfit ? "rgba(53, 242, 180, 0.12)" : "rgba(255, 92, 114, 0.12)";
        ctx.fill();

        // Dot
        ctx.beginPath();
        ctx.arc(tagX + 7, 88, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = isProfit ? "#35f2b4" : "#ff5c72";
        ctx.fill();

        // Tag label
        ctx.fillStyle = isProfit ? "#35f2b4" : "#ff5c72";
        ctx.fillText(tagText, tagX + 14, 92);
        ctx.restore();

        // PnL% Large Text
        ctx.save();
        ctx.font = "700 56px 'Space Grotesk', sans-serif";
        const pnlStr = `${isProfit ? "+" : ""}${derivedPnl.toFixed(1)}%`;
        const pnlGrad = ctx.createLinearGradient(26, 110, 260, 160);
        if (isProfit) {
          pnlGrad.addColorStop(0, "#35f2b4");
          pnlGrad.addColorStop(1, "#0f8c7c");
        } else {
          pnlGrad.addColorStop(0, "#ff9d8a");
          pnlGrad.addColorStop(1, "#ff5c72");
        }
        ctx.fillStyle = pnlGrad;
        ctx.fillText(pnlStr, 26, 154);
        ctx.restore();

        // Profit subtext
        ctx.save();
        if (state.profitAmount !== undefined) {
          ctx.font = "500 14px 'Inter', sans-serif";
          ctx.fillStyle = "#78829f";
          const profitLabel = `${state.profitAmount >= 0 ? "+" : ""}${Number(state.profitAmount).toFixed(4)} ${state.profitUnit}`;
          ctx.fillText(profitLabel, 26, 180);
          const prW = ctx.measureText(profitLabel).width;
          ctx.fillText(` ${isProfit ? "realized profit" : "realized loss"}`, 26 + prW, 180);
        }
        ctx.restore();

        // Divider bars
        ctx.save();
        const divY = 208;
        const grad1 = ctx.createLinearGradient(26, 0, w - 26, 0);
        grad1.addColorStop(0, "#23e6c4");
        grad1.addColorStop(1, "transparent");

        ctx.fillStyle = grad1;
        ctx.globalAlpha = 0.55;
        roundRect(ctx, 26, divY, w - 52, 2, 1);
        ctx.fill();

        ctx.globalAlpha = 0.3;
        roundRect(ctx, 26, divY + 6, (w - 52) * 0.62, 2, 1);
        ctx.fill();

        ctx.globalAlpha = 0.15;
        roundRect(ctx, 26, divY + 12, (w - 52) * 0.3, 2, 1);
        ctx.fill();
        ctx.restore();

        // Grid fields
        const col1X = 26;
        const col2X = w / 2 + 10;
        let rowY = 250;

        drawField(ctx, col1X, rowY, "Entry price", formatPrice(state.entryPrice));
        drawField(ctx, col2X, rowY, "Current price", formatPrice(state.currentPrice));

        rowY += 48;
        drawField(ctx, col1X, rowY, "Entry cap", formatCompact(state.entryMcap));
        drawField(ctx, col2X, rowY, "Current cap", formatCompact(state.currentMcap));

        rowY += 48;
        drawField(ctx, col1X, rowY, "Position", formatPosition(state.positionSize, state.positionUnit || state.tokenSymbol));
        drawField(ctx, col2X, rowY, "Duration", state.duration || "—");

        // Footer
        ctx.save();
        const footerY = 460;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.beginPath();
        ctx.moveTo(26, footerY);
        ctx.lineTo(w - 26, footerY);
        ctx.stroke();

        ctx.font = "500 12px 'Inter', sans-serif";
        ctx.fillStyle = "#78829f";
        ctx.fillText(state.handle || "", 26, footerY + 28);

        ctx.fillStyle = "#454d66";
        const dateW = ctx.measureText(state.date || "").width;
        ctx.fillText(state.date || "", w - 26 - dateW, footerY + 28);
        ctx.restore();

        // Convert to blob and download
        canvas.toBlob((blob) => {
          if (!blob) return;
          const a = document.createElement("a");
          a.download = `RacerBot-PnL-${state.tokenSymbol}-${Date.now()}.png`;
          a.href = URL.createObjectURL(blob);
          a.click();
          showToast("Card image downloaded! 📸");
        }, "image/png");

      } catch (err) {
        console.error("Export error:", err);
        showToast("Error generating image.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = origText;
      }
    });

    function drawField(ctx, x, y, label, val) {
      ctx.save();
      ctx.font = "500 11.5px 'Inter', sans-serif";
      ctx.fillStyle = "#78829f";
      ctx.fillText(label, x, y);

      ctx.font = "600 15px 'Inter', sans-serif";
      ctx.fillStyle = "#f4f6ff";
      ctx.fillText(val, x, y + 20);
      ctx.restore();
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawBoltPath(ctx, x, y, width, height) {
      const scaleX = width / 40;
      const scaleY = height / 40;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scaleX, scaleY);
      ctx.beginPath();
      ctx.moveTo(22, 3);
      ctx.lineTo(10, 22);
      ctx.lineTo(18, 22);
      ctx.lineTo(16, 37);
      ctx.lineTo(30, 16);
      ctx.lineTo(21, 16);
      ctx.lineTo(23, 3);
      ctx.closePath();
      ctx.restore();
    }
  </script>
</body>
