[package]
name = "racerbot-router"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk-rs = ">=4.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = { version = "1.5", features = ["derive"] }
hex = "0.4"
base64 = "0.21"

[profile.release]
opt-level = 3
lto = true