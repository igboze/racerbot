[package]
name = "racerbot-router"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.5.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
near-sdk = { version = "5.5.0", features = ["unit-testing"] }


[profile.dev]
codegen-units = 1
incremental = false

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
incremental = false

[profile.dev.build-override]
codegen-units = 1
incremental = false

[profile.release.build-override]
codegen-units = 1
incremental = false