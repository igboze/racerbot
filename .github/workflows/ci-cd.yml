# GitHub Actions workflow for RacerBot
# Railway deploys main itself once this check passes, so this workflow only builds and checks.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # The same build Railway runs: it type-checks every package, so a type error fails here first
      - run: npm run build
      # Report only until the existing lint errors are cleaned up; it must not block deploys meanwhile
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true
