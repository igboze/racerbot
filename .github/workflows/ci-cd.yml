# GitHub Actions workflow for RacerBot
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, detector, executor, triggers, db]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck

  contract-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - run: cargo test

  deploy:
    needs: [test, contract-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/deploy.sh
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      KEY_ENCRYPTION_MASTER_KEY: ${{ secrets.KEY_ENCRYPTION_MASTER_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RPC_PROVIDERS: ${{ secrets.RPC_PROVIDERS }}

  contract-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: router-contract
          path: target/wasm32-unknown-unknown/release/racerbot_router.wasm